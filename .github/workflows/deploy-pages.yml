name: Deploy to GitHub Pages

# Publishes the built site with GitHub Pages (docs/DEPLOYMENT.md) on every merge to `main`, or
# when started by hand (Actions → Deploy to GitHub Pages → Run workflow). The site is built for
# the custom domain set in Settings → Pages, so absolute links, the sitemap and share images
# always match the address the site is served at; changing that domain needs one run by hand.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      site_url:
        description: >-
          Address to build for. Leave empty for the custom domain set in Settings → Pages.
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time; a running one is never cancelled halfway
concurrency:
  group: pages
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: '1'
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # reads the Pages settings; `origin` is the custom domain, e.g. https://owl-ml.com
      - id: pages
        uses: actions/configure-pages@v6
      - name: Build (checks all content; absolute links, sitemap and share images use the address)
        run: npm run build
        env:
          SITE_URL: ${{ inputs.site_url || steps.pages.outputs.origin }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
