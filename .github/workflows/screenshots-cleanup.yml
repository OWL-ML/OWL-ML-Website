name: Screenshot cleanup

# Screenshots for a pull request description (after launch, for layout or component changes) live
# on the branch `screenshots/pr-<number>` while the pull request is open (CLAUDE.md, working
# conventions). When it is merged or closed, that
# branch is deleted, so old screenshots do not pile up in the repository. Takes a few seconds.
on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  delete:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Delete this pull request's screenshot branch, if there is one
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: screenshots/pr-${{ github.event.pull_request.number }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" --silent 2>/dev/null; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH"
            echo "Deleted $BRANCH"
          else
            echo "No branch $BRANCH"
          fi
