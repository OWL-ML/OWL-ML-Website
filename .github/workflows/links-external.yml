name: External links

# Outside links break without anyone touching this repository, so they are checked weekly and
# on demand, not in every pull request (an unreachable outside site must not block a merge).
# A failed run shows the dead links in its log; GitHub emails the repository's watchers.
on:
  schedule:
    - cron: '17 6 * * 1' # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: '1'
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  external-links:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check external links
        run: npm run links:external
